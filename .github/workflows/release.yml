name: Release

# Tag-driven. `git tag v0.3.0 && git push --tags` builds every artifact and attaches it to
# a GitHub Release. Publishing to PyPI / Open VSX / the Marketplace is deliberately NOT
# wired here yet — that needs accounts and secrets that do not exist, and a half-configured
# publish step that fails on every tag is worse than no publish step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a release"
        type: boolean
        default: true

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  verify:
    # A tag must not be able to ship something the test suite would have rejected.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,lsp]"
      - run: pytest
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python scripts/sync_version.py --check
          declared=$(python -c "import sys; sys.path.insert(0,'src'); import aurelius_ide; print(aurelius_ide.__version__)")
          tagged="${GITHUB_REF_NAME#v}"
          echo "package says $declared, tag says $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($declared)."
            echo "::error::Bump src/aurelius_ide/__init__.py and re-tag."
            exit 1
          fi

  python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  extension:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix

  release:
    needs: [python, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.vsix' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "--- release contents ---"
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body_path: ${{ github.workspace }}/.github/release-body.md
          fail_on_unmatched_files: true
