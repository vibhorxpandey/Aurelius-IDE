[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurelius-ide"
version = "0.1.0"
description = "A language server for research papers: live citation verification and claim analysis for LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vibhor Pandey", email = "vibhorpandey09@gmail.com" }]
keywords = ["lsp", "latex", "research", "citations", "fact-checking", "bibtex", "academic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

# The analysis engine is pure standard library. Both the language-server transport and
# the scholarly-verification backend are optional, so the core stays installable
# anywhere and usable headless in CI.
dependencies = []

[project.optional-dependencies]
lsp = ["pygls>=2.0"]
verify = ["aurelius-mcp>=0.6.1"]
# ruff is pinned to a minor series: its import-grouping and UP rules change between
# releases, and an unpinned range means `ruff check` can pass locally and fail in CI on
# the same source.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]
all = ["pygls>=2.0", "aurelius-mcp>=0.6.1"]

[project.scripts]
aurelius-lsp = "aurelius_ide.lsp:main"

[project.urls]
Homepage = "https://github.com/vibhorxpandey/aurelius-ide"
Repository = "https://github.com/vibhorxpandey/aurelius-ide"
Issues = "https://github.com/vibhorxpandey/aurelius-ide/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aurelius_ide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, ruff cannot tell that `aurelius_ide` is this project rather than a
# third-party package, and groups the test imports differently depending on whether the
# package happens to be installed. That made `ruff check` pass locally and fail in CI.
known-first-party = ["aurelius_ide"]
